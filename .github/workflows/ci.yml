name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # The conformance module pins hadron-cli, which sets the toolchain.
          go-version-file: conformance/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: conformance (runs the built adapter against hadron-cli's published contract rules)
        run: cd conformance && go vet ./... && go test ./...
      - name: cross-build the release targets
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null .
          done
